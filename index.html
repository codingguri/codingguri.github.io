<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Future Digital Nomad Portfolio</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="hero-section">
            <div class="hero-overlay">
                <h1>Future Digital Nomad</h1>
            </div>
        </header>

        <div class="profile-container">
            <div class="profile-circle">
                <img src="/img/profile-image.jpg" alt="Frog Profile" />
            </div>
            <div class="profile-info">
                <h2>코딩하는 개구리</h2>
                <p>디지털 노마드를 꿈꾸는 초보 개발자</p>
            </div>
        </div>

        <main class="content-wrapper">
            <div class="card-container">
                <div class="card">
                    <div class="badge">Programming Language</div>
                    <div class="card-body">
                        <ul>
                            <li>
                                JavaScript <span class="status-tag">~ing</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="card">
                    <div class="badge">Real Language</div>
                    <div class="card-body">
                        <ul>
                            <li>Spanish</li>
                            <li>Portuguese</li>
                            <li>Italian</li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
